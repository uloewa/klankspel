<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6EBD9">
<title>Klankspel</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./stijl.css">
<style>
  @font-face{font-family:"Andika";src:url("./fonts/Andika-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Andika";src:url("./fonts/Andika-Bold.woff2") format("woff2");font-weight:700;font-display:swap}

  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(1rem,3.5vh,2rem);padding:1rem;text-align:center;overflow:hidden}

  .scherm{display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(1rem,3.5vh,2rem);width:100%}
  .scherm.aan{display:flex}

  /* Startscherm: één ding om op te tikken. Geen menu, geen tekst — ze kan nog niet lezen. */
  #start-knop{
    width:clamp(140px,34vw,240px);height:clamp(140px,34vw,240px);border-radius:50%;
    border:none;background:var(--vriend);box-shadow:0 7px 0 var(--vriend-diep);
    display:grid;place-items:center;cursor:pointer;
  }
  #start-knop svg{width:42%;height:42%;fill:#FFF9F2}
  #start-knop:active{transform:translateY(5px);box-shadow:0 2px 0 var(--vriend-diep)}

  #luister{width:clamp(84px,15vw,110px);height:clamp(84px,15vw,110px)}
  #keuzes{display:flex;gap:clamp(1rem,4vw,2.5rem);flex-wrap:wrap;justify-content:center}

  /* Klankmuur: vrij spel, geen goed of fout. */
  #muur{display:grid;gap:clamp(.6rem,2.5vw,1.2rem);
    grid-template-columns:repeat(auto-fit,minmax(clamp(88px,20vw,150px),1fr));
    width:min(100%,44rem)}
  #muur .kaart-letter{width:100%;height:clamp(88px,20vw,150px);font-size:clamp(3rem,10vw,5rem)}

  .knop-verder{
    border:none;background:none;padding:.6rem;cursor:pointer;
    width:var(--raak-min);height:var(--raak-min);display:grid;place-items:center;
  }
  .knop-verder svg{width:100%;height:100%;fill:var(--vriend)}

  /* De ouderpoort. env(safe-area-inset-top) is geen franje: als app loopt de pagina tot
     onder de statusbalk van Android, en dan landt de vinger daarop in plaats van hier. */
  #ouderpoort{
    position:fixed;z-index:10;
    top:calc(env(safe-area-inset-top, 0px) + 12px);
    right:calc(env(safe-area-inset-right, 0px) + 8px);
    width:96px;height:96px;background:none;border:none;padding:0;cursor:default;
    touch-action:none;-webkit-user-select:none;user-select:none;
  }
  #ouderpoort::after{
    content:"";position:absolute;inset:auto 12px 12px auto;width:8px;height:8px;
    border-radius:50%;background:var(--vriend);opacity:0;
    transition:opacity .2s ease,transform .2s ease;
  }
  #ouderpoort.gaat::after{opacity:.9;transform:scale(2.4);transition:transform 3s linear,opacity .2s ease}
  #ouderpoort:focus-visible{outline:2px solid var(--vriend);outline-offset:-4px}

  @media (prefers-reduced-motion: reduce){
    #ouderpoort.gaat::after{transition:opacity .2s ease}
  }

  /* Gastmodus zichtbaar zonder één letter tekst: een gekleurde rand rondom. Thijs ziet
     in één oogopslag dat dit niet Ida's spel is; voor een kind is het gewoon een randje. */
  body.gast{
    background:
      linear-gradient(var(--vriend),var(--vriend)) top/100% 10px no-repeat,
      linear-gradient(var(--vriend),var(--vriend)) bottom/100% 10px no-repeat,
      var(--papier);
  }
</style>
</head>
<body>

<button id="ouderpoort" aria-label="Ouderscherm — houd drie seconden ingedrukt"></button>

<!-- 1. beginnen -->
<div class="scherm aan" id="s-start">
  <svg viewBox="0 0 120 110" class="vriendje" aria-hidden="true">
    <ellipse cx="60" cy="102" rx="34" ry="6" fill="#E0D2BB"/>
    <circle cx="60" cy="58" r="42" fill="#E8956B"/>
    <circle cx="24" cy="34" r="10" fill="#E8956B"/><circle cx="96" cy="34" r="10" fill="#E8956B"/>
    <circle cx="46" cy="52" r="7" fill="#3B2C22"/><circle cx="74" cy="52" r="7" fill="#3B2C22"/>
    <path class="mond" d="M48 74 Q60 80 72 74" stroke="#3B2C22" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>
  <button id="start-knop" aria-label="Beginnen">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
</div>

<!-- 2. welke hoor je? -->
<div class="scherm" id="s-spel">
  <button id="luister" class="knop-rond" aria-label="Hoor de klank opnieuw">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.5 7-8.8s-3-7.8-7-8.8z"/></svg>
  </button>
  <div id="keuzes"></div>
  <svg viewBox="0 0 120 110" class="vriendje" id="maatje" aria-hidden="true">
    <ellipse cx="60" cy="102" rx="34" ry="6" fill="#E0D2BB"/>
    <circle cx="60" cy="58" r="42" fill="#E8956B"/>
    <circle cx="24" cy="34" r="10" fill="#E8956B"/><circle cx="96" cy="34" r="10" fill="#E8956B"/>
    <circle cx="46" cy="52" r="7" fill="#3B2C22"/><circle cx="74" cy="52" r="7" fill="#3B2C22"/>
    <path class="mond" id="mond" d="M48 74 Q60 80 72 74" stroke="#3B2C22" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>
</div>

<!-- 3. klankmuur: vrij spel, niets kan fout -->
<div class="scherm" id="s-muur">
  <div id="muur"></div>
  <button class="knop-verder" id="verder" aria-label="Verder spelen">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
</div>

<!-- 4. klaar voor vandaag -->
<div class="scherm" id="s-einde">
  <svg viewBox="0 0 120 110" class="vriendje blij" aria-hidden="true">
    <ellipse cx="60" cy="102" rx="34" ry="6" fill="#E0D2BB"/>
    <circle cx="60" cy="58" r="42" fill="#E8956B"/>
    <circle cx="24" cy="34" r="10" fill="#E8956B"/><circle cx="96" cy="34" r="10" fill="#E8956B"/>
    <circle cx="46" cy="52" r="7" fill="#3B2C22"/><circle cx="74" cy="52" r="7" fill="#3B2C22"/>
    <path class="mond" d="M44 70 Q60 88 76 70" stroke="#3B2C22" stroke-width="5" fill="none" stroke-linecap="round"/>
  </svg>
</div>

<script type="module">
import { Zeg }   from './js/zeg.js';
import { Log }   from './js/log.js';
import { Motor } from './js/motor.js';

/* Stand 1, nu met de meegroei-motor: de motor kiest welke letter aan de beurt is en
   hoeveel keuzes erbij horen. Alles wat een drempel is, staat in data/motor.json. */

let klankVan = {};                 // id -> wat de computerstem zegt als er geen opname is
let huidige = null, bezig = false;
let sessieStart = 0, vraagTijd = 0, gastModus = null;

const $ = id => document.getElementById(id);
const scherm = naam => document.querySelectorAll('.scherm')
  .forEach(s => s.classList.toggle('aan', s.id === 's-' + naam));

function gezicht(stand) {
  const m = $('maatje'), mond = $('mond');
  m.classList.remove('blij', 'kijkt');
  if (stand === 'blij') { mond.setAttribute('d', 'M44 70 Q60 88 76 70'); m.classList.add('blij'); }
  else if (stand === 'kijkt') { mond.setAttribute('d', 'M54 72 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0'); m.classList.add('kijkt'); }
  else mond.setAttribute('d', 'M48 74 Q60 80 72 74');
}

const prijs = () => ['j1','j2','j3','j4','j5','j6','j7'][Math.floor(Math.random()*7)];
const troost = () => ['n1','n2','n3','n4'][Math.floor(Math.random()*4)];

function ronde(vraag = null) {
  bezig = false;
  gezicht('rustig');
  scherm('spel');
  huidige = vraag || Motor.volgende();

  const veld = $('keuzes');
  veld.innerHTML = '';
  huidige.opties.forEach(id => {
    const b = document.createElement('button');
    b.className = 'kaart-letter';
    b.textContent = id;
    b.setAttribute('aria-label', 'letter ' + id);
    b.onclick = () => antwoord(b, id);
    veld.appendChild(b);
  });
  setTimeout(() => {
    Zeg.zeg(huidige.doel, klankVan[huidige.doel]);
    vraagTijd = Date.now();       // vanaf hier meten we hoe snel ze tikt
  }, 400);
}

async function antwoord(knop, gekozen) {
  if (bezig) return;
  const reactie = vraagTijd ? Date.now() - vraagTijd : null;
  const r = Motor.antwoord(huidige.doel, gekozen, reactie, huidige.herhaling);

  if (r.juist) {
    bezig = true;
    knop.classList.add('juist');
    gezicht('blij');
    if (!gastModus) Log.boek('juist', { letter: huidige.doel, ms: reactie, telt: r.teltMee });
    await Zeg.zeg(prijs(), 'goed zo', { wacht: true });

    // De sessie eindigt ALTIJD op een juist antwoord, nooit midden in een fout.
    if (r.magAfronden || Date.now() - sessieStart > Motor.sessieMs()) return einde();
    setTimeout(() => ronde(), 300);
    return;
  }

  // Fout: geen rood, geen straf. De klank nog eens, de juiste licht op.
  if (!gastModus) Log.boek('fout', { letter: huidige.doel, gekozen, ms: reactie, telt: r.teltMee });
  knop.classList.add('mis');
  gezicht('kijkt');
  await Zeg.zeg(huidige.doel, klankVan[huidige.doel], { wacht: true });
  [...document.querySelectorAll('.kaart-letter')]
    .find(b => b.textContent === huidige.doel)?.classList.add('wijs');

  if (r.gefrustreerd) {
    await Zeg.zeg(troost(), 'goed geprobeerd', { wacht: true });
    return klankmuur();
  }
  // Meteen dezelfde vraag, makkelijker gemaakt: een mislukte poging helpt pas als ze
  // er kort daarna wél in slaagt.
  setTimeout(() => ronde(Motor.herhaal(huidige.doel)), 700);
}

/* De klankmuur is de uitweg, niet een straf: hier kan niets fout gaan.
   Ze tikt een letter, ze hoort hem. Verder gaan mag wanneer ze wil. */
function klankmuur() {
  if (!gastModus) Log.boek('muur');
  scherm('muur');
  const m = $('muur');
  m.innerHTML = '';
  Motor.toestand().actief.forEach(id => {
    const b = document.createElement('button');
    b.className = 'kaart-letter';
    b.textContent = id;
    b.setAttribute('aria-label', 'letter ' + id);
    b.onclick = () => Zeg.zeg(id, klankVan[id]);
    m.appendChild(b);
  });
}

async function einde() {
  if (!gastModus) Log.boek('einde');
  scherm('einde');
  await Zeg.zeg('s3', 'jij hebt goed gewerkt vandaag', { wacht: true });
  await Zeg.zeg('s2', 'we stoppen hier, tot morgen');
}

async function beginSessie() {
  sessieStart = Date.now();
  if (!gastModus) Log.boek('start');
  await Zeg.zeg('s1', 'dag, zullen we luisteren?', { wacht: true });
  ronde();
}

/* ---- opstarten ---- */
(async function () {
  const klanken = await fetch('./data/klanken.json').then(r => r.json());
  // De leervolgorde: rekbaar en makkelijk te horen eerst, de verwarrende paren laat.
  const letters = klanken.klanken
    .filter(k => k.start)
    .sort((a, b) => a.start - b.start)
    .map(k => ({ id: k.id, klank: k.zeg }));
  letters.forEach(l => { klankVan[l.id] = l.klank; });

  /* Gastmodus staat in sessionStorage, en dat is precies goed: die verdwijnt vanzelf
     zodra de app dichtgaat. Anders staat hij er over drie weken nog aan en registreert
     de app Ida's voortgang niet meer. */
  gastModus = sessionStorage.getItem('klankspel-gast');
  if (gastModus) document.body.classList.add('gast');

  await Motor.laad(letters, gastModus ? { profiel: 'gast', gastSoort: gastModus } : {});
  await Zeg.laad();

  $('start-knop').onclick = beginSessie;
  $('luister').onclick = () => huidige && Zeg.zeg(huidige.doel, klankVan[huidige.doel]);
  $('verder').onclick = () => ronde();

  // Weggaan halverwege telt ook als informatie: waar haakte ze af?
  addEventListener('pagehide', () => { if (sessieStart && !gastModus) Log.boek('stop'); });
})();

/* ---- ouderpoort: drie seconden ingedrukt ---- */
const poort = $('ouderpoort');
let klok = null;
poort.addEventListener('pointerdown', e => {
  e.preventDefault();
  // teller EERST: setPointerCapture kan gooien en doodde eerder stil de hele poort
  poort.classList.add('gaat');
  klok = setTimeout(() => { location.href = './ouder.html'; }, 3000);
  try { poort.setPointerCapture?.(e.pointerId); } catch {}
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(n =>
  poort.addEventListener(n, () => { clearTimeout(klok); poort.classList.remove('gaat'); }));
poort.addEventListener('dragstart', e => e.preventDefault());
</script>

</body>
</html>
