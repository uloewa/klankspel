<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6EBD9">
<title>Klankspel</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./stijl.css">
<style>
  /* Andika (SIL, OFL) — gemaakt voor beginnende lezers: enkele-lus a en g, de vorm die
     kleuters schrijven. Meegeleverd, nooit van een CDN: de app moet offline werken. */
  @font-face {
    font-family:"Andika"; src:url("./fonts/Andika-Regular.woff2") format("woff2");
    font-weight:400; font-display:swap;
  }
  @font-face {
    font-family:"Andika"; src:url("./fonts/Andika-Bold.woff2") format("woff2");
    font-weight:700; font-display:swap;
  }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:1.4rem; padding:max(1.5rem, env(safe-area-inset-top)) 1.5rem; text-align:center;
  }
  h1 { font-size:clamp(2.5rem, 12vw, 5rem); margin:0; letter-spacing:.02em; font-weight:700; }
  p  { margin:0; font-size:clamp(1rem, 4vw, 1.3rem); color:var(--zacht); max-width:30ch; line-height:1.5; }
  #proef { font-size:clamp(2.2rem, 10vw, 4rem); font-weight:700; letter-spacing:.08em; }
  #status { display:flex; flex-direction:column; gap:.6rem; font-size:clamp(.95rem, 3.6vw, 1.1rem); }
  .regel { display:flex; align-items:center; gap:.6rem; justify-content:center; }
  .stip { width:.9rem; height:.9rem; border-radius:50%; background:var(--zacht); flex:none; }
  .ja  .stip { background:var(--goed);   } .ja  { color:var(--goed);   }
  .nee .stip { background:var(--let-op); } .nee { color:var(--let-op); }

  /* De ouderpoort: rechtsboven, onzichtbaar, drie seconden ingedrukt houden.
     Geen knop, geen tekst, geen icoontje — niets dat Ida uitnodigt om te tikken. */
  #ouderpoort {
    position:fixed; top:0; right:0; width:72px; height:72px;
    background:none; border:none; padding:0; cursor:default;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  #ouderpoort::after {
    content:""; position:absolute; inset:auto 10px 10px auto;
    width:8px; height:8px; border-radius:50%;
    background:var(--vriend); opacity:0; transition:opacity .2s ease, transform .2s ease;
  }
  #ouderpoort.gaat::after { opacity:.9; transform:scale(2.4); transition:transform 3s linear, opacity .2s ease; }
  #ouderpoort:focus-visible { outline:2px solid var(--vriend); outline-offset:-4px; }
</style>
</head>
<body>

<button id="ouderpoort" aria-label="Ouderscherm — houd drie seconden ingedrukt"></button>

<h1>Klankspel</h1>
<p>Nog leeg. Dit scherm toont alleen dat de app op de tablet werkt.</p>

<!-- Proefregel: zo ziet Ida de letters straks. De a en de g hebben één lus. -->
<div id="proef" aria-hidden="true">a g m s ij ë</div>

<svg viewBox="0 0 120 110" class="vriendje" aria-hidden="true">
  <ellipse cx="60" cy="102" rx="34" ry="6" fill="#E0D2BB"/>
  <circle cx="60" cy="58" r="42" fill="#E8956B"/>
  <circle cx="24" cy="34" r="10" fill="#E8956B"/>
  <circle cx="96" cy="34" r="10" fill="#E8956B"/>
  <circle cx="46" cy="52" r="7" fill="#3B2C22"/>
  <circle cx="74" cy="52" r="7" fill="#3B2C22"/>
  <path class="mond" d="M48 74 Q60 80 72 74" stroke="#3B2C22" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>

<div id="status">
  <div class="regel" id="r-sw"><span class="stip"></span><span>offline-geheugen: aan het opzetten…</span></div>
  <div class="regel" id="r-net"><span class="stip"></span><span>verbinding: nakijken…</span></div>
  <div class="regel" id="r-app"><span class="stip"></span><span>geopend als: nakijken…</span></div>
</div>

<script>
  function zet(id, ok, tekst) {
    const el = document.getElementById(id);
    el.className = 'regel ' + (ok ? 'ja' : 'nee');
    el.lastElementChild.textContent = tekst;
  }

  // 1. Service worker — dit is wat offline werken mogelijk maakt.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => navigator.serviceWorker.ready)
      .then(() => zet('r-sw', true, 'offline-geheugen: aan'))
      .catch(() => zet('r-sw', false, 'offline-geheugen: mislukt'));
  } else {
    zet('r-sw', false, 'offline-geheugen: niet ondersteund');
  }

  // 2. Verbinding — zet wifi uit en herlaad: dit hoort dan "uit" te zeggen en de pagina moet blijven werken.
  function net() { zet('r-net', navigator.onLine, 'verbinding: ' + (navigator.onLine ? 'aan' : 'uit — en dit scherm laadt nog')); }
  net();
  addEventListener('online', net);
  addEventListener('offline', net);

  // 3. Als app of in de browser geopend?
  const alsApp = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  zet('r-app', alsApp, 'geopend als: ' + (alsApp ? 'app (geen browserbalk)' : 'browser — nog niet toegevoegd aan startscherm'));

  // 4. Ouderpoort: drie seconden ingedrukt houden. Loslaten annuleert.
  const poort = document.getElementById('ouderpoort');
  let klok = null;
  function begin(e) {
    e.preventDefault();
    poort.setPointerCapture?.(e.pointerId);
    poort.classList.add('gaat');
    klok = setTimeout(() => { location.href = './ouder.html'; }, 3000);
  }
  function stop() {
    clearTimeout(klok); klok = null;
    poort.classList.remove('gaat');
  }
  poort.addEventListener('pointerdown', begin);
  poort.addEventListener('pointerup', stop);
  poort.addEventListener('pointercancel', stop);
  poort.addEventListener('pointerleave', stop);
  poort.addEventListener('dragstart', e => e.preventDefault());
</script>

</body>
</html>
