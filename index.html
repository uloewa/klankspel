<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6EBD9">
<title>Klankspel</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./stijl.css">
<style>
  @font-face{font-family:"Andika";src:url("./fonts/Andika-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Andika";src:url("./fonts/Andika-Bold.woff2") format("woff2");font-weight:700;font-display:swap}

  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(1rem,3.5vh,2rem);text-align:center;overflow:hidden;
    /* Als app loopt de pagina tot onder de statusbalk; zonder deze marge staat de
       inhoud daar deels achter. */
    padding:
      calc(env(safe-area-inset-top, 0px) + .8rem)
      calc(env(safe-area-inset-right, 0px) + .8rem)
      calc(env(safe-area-inset-bottom, 0px) + .8rem)
      calc(env(safe-area-inset-left, 0px) + .8rem);
  }

  .scherm{display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(.8rem,3vh,1.8rem);width:100%}
  .scherm.aan{display:flex}

  /* Het vriendje krijgt een vaste hoogte. Zonder dat verspringt het hele scherm zodra
     het aantal kaarten wijzigt — en dan verplaatst de knop zich onder haar vinger. */
  #s-spel .vriendje{height:clamp(70px,13vh,120px);width:auto;flex:none}
  /* Het eindscherm is het laatste wat ze ziet: daar mag het figuurtje groot zijn.
     Klein in het midden van een leeg scherm voelt als een foutmelding, niet als een feestje. */
  #s-einde .vriendje{height:min(46vh,44vw,340px);width:auto}

  /* Wie speelt er vandaag mee? Geen tekst — ze kan nog niet lezen, dus de figuurtjes
     zelf zijn de knoppen. Tikken start meteen het spel. */
  #kiezers{display:grid;gap:clamp(.6rem,2.2vw,1.2rem);grid-template-columns:repeat(3,1fr);
    width:min(100%,34rem)}
  @media (orientation:landscape){ #kiezers{grid-template-columns:repeat(6,1fr);width:min(100%,58rem)} }
  #kiezers button{
    border:2px solid var(--kaart-diep);border-radius:24px;background:var(--kaart);
    box-shadow:0 5px 0 var(--kaart-diep);padding:.5rem;cursor:pointer;
    display:grid;place-items:center;min-height:var(--raak-min);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  #kiezers button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--kaart-diep)}
  /* wie de vorige keer meespeelde, staat alvast in het groen */
  #kiezers button.gekozen{border-color:var(--goed);box-shadow:0 5px 0 var(--goed)}
  /* Op BREEDTE schalen, niet op hoogte: de kolom bepaalt hoeveel ruimte er is. Andersom
     puilden de figuurtjes uit hun knop en overlapten ze elkaar. */
  #kiezers .vriendje{width:100%;height:auto;max-height:26vh;display:block}
  #eind-plek .vriendje{height:min(46vh,44vw,340px);width:auto}

  #luister{width:clamp(76px,13vh,104px);height:clamp(76px,13vh,104px);flex:none}

  /* Het plaatje bij een woordronde: ze ziet 🌙, hoort "maan", wijst de m aan. */
  #plaatje{font-size:clamp(3.5rem,17vh,7rem);line-height:1;display:none}
  /* De foto bij een familieronde. Vervaagt naarmate ze de naam kent — anders kijkt ze
     naar het gezicht en nooit naar het woord. */
  #foto{width:min(22vh,30vw,190px);height:min(22vh,30vw,190px);border-radius:26px;
    object-fit:cover;border:3px solid var(--kaart-diep);transition:opacity .4s ease}
  #plaatje.aan{display:block}

  /* Kaarten: een raster dat 2, 3 en 4 altijd evenwichtig legt. Een flex-rij met wrap
     brak bij vier naar 3+1, en die eenzame kaart onderaan trekt de aandacht — dat
     beïnvloedt haar keuze. Grootte begrensd op breedte ÉN hoogte, zodat er ook liggend
     niets buiten beeld valt. */
  /* flex:none is hier geen detail — zonder dat kneep de kolom het raster samen zodra het
     plaatje er ruimte bij vroeg, en staken de letters boven hun kaart uit. */
  #keuzes{display:grid;gap:clamp(.7rem,2.6vw,1.8rem);justify-content:center;align-content:center;flex:none}
  #keuzes .kaart-letter{
    width:var(--kaartmaat);height:var(--kaartmaat);font-size:calc(var(--kaartmaat) * .55);flex:none;
  }
  #keuzes[data-n="2"]{grid-template-columns:repeat(2,auto); --kaartmaat:min(38vw,36vh,260px)}
  #keuzes[data-n="3"]{grid-template-columns:repeat(3,auto); --kaartmaat:min(27vw,32vh,220px)}
  #keuzes[data-n="4"]{grid-template-columns:repeat(2,auto); --kaartmaat:min(38vw,23vh,200px)}
  @media (orientation:landscape){
    #keuzes[data-n="3"]{--kaartmaat:min(24vw,36vh,220px)}
    #keuzes[data-n="4"]{grid-template-columns:repeat(4,auto); --kaartmaat:min(20vw,36vh,200px)}
  }

  /* Staat er een plaatje bij, dan is er minder hoogte over voor de kaarten. */
  #keuzes.met-plaatje[data-n="2"]{--kaartmaat:min(38vw,25vh,210px)}
  #keuzes.met-plaatje[data-n="3"]{--kaartmaat:min(27vw,22vh,180px)}
  #keuzes.met-plaatje[data-n="4"]{--kaartmaat:min(38vw,17vh,160px)}
  @media (orientation:landscape){
    #keuzes.met-plaatje[data-n="3"]{--kaartmaat:min(24vw,26vh,180px)}
    #keuzes.met-plaatje[data-n="4"]{--kaartmaat:min(20vw,26vh,170px)}
  }

  /* Namen zijn woorden, geen letters. Deze regel MOET na .kaart-letter staan en twee
     klassen gebruiken: anders wint de lettergrootte van een losse letter (0,55 × de
     kaartmaat) en puilt de naam over zijn kaart heen. */
  #keuzes .kaart-letter.kaart-naam{
    width:min(40vw,300px);height:min(19vh,24vw,150px);
    font-size:clamp(1rem,3.2vw,1.9rem);line-height:1.2;padding:0 .6rem;
    overflow-wrap:anywhere;hyphens:auto;
  }

  /* De fout gekozen kaart stapt terug: kleiner en zonder diepte. Duidelijker dan alleen
     vervagen, en nog steeds zonder één spoor rood — er valt niets te verliezen. */
  #keuzes .kaart-letter.mis{opacity:.55;transform:scale(.9);box-shadow:none}

  /* Klankmuur: vrij spel, geen goed of fout. Vast raster i.p.v. auto-fit, zodat de
     vorm niet verspringt met het aantal letters. */
  #muur{display:grid;gap:clamp(.5rem,2vw,1rem);grid-template-columns:repeat(3,1fr);
    width:min(100%,40rem)}
  #muur .kaart-letter{width:100%;height:min(26vw,20vh,150px);font-size:min(13vw,10vh,4.5rem)}
  @media (orientation:landscape){ #muur{grid-template-columns:repeat(6,1fr)} }

  .knop-verder{
    border:none;background:none;padding:.6rem;cursor:pointer;
    width:var(--raak-min);height:var(--raak-min);display:grid;place-items:center;
  }
  .knop-verder svg{width:100%;height:100%;fill:var(--vriend)}

  /* De ouderpoort. env(safe-area-inset-top) is geen franje: als app loopt de pagina tot
     onder de statusbalk van Android, en dan landt de vinger daarop in plaats van hier. */
  #ouderpoort{
    position:fixed;z-index:10;
    top:calc(env(safe-area-inset-top, 0px) + 12px);
    right:calc(env(safe-area-inset-right, 0px) + 8px);
    width:96px;height:96px;background:none;border:none;padding:0;cursor:default;
    touch-action:none;-webkit-user-select:none;user-select:none;
  }
  #ouderpoort::after{
    content:"";position:absolute;inset:auto 12px 12px auto;width:8px;height:8px;
    border-radius:50%;background:var(--vriend);opacity:0;
    transition:opacity .2s ease,transform .2s ease;
  }
  #ouderpoort.gaat::after{opacity:.9;transform:scale(2.4);transition:transform 3s linear,opacity .2s ease}
  #ouderpoort:focus-visible{outline:2px solid var(--vriend);outline-offset:-4px}

  @media (prefers-reduced-motion: reduce){
    #ouderpoort.gaat::after{transition:opacity .2s ease}
  }

  /* Gastmodus zichtbaar zonder één letter tekst: een gekleurde rand rondom. Thijs ziet
     in één oogopslag dat dit niet Ida's spel is; voor een kind is het gewoon een randje. */
  body.gast{
    background:
      linear-gradient(var(--vriend),var(--vriend)) top/100% 10px no-repeat,
      linear-gradient(var(--vriend),var(--vriend)) bottom/100% 10px no-repeat,
      var(--papier);
  }

  /* ---------- startmenu, schrijven en naam bouwen ---------- */
  #menu-plek .vriendje{height:clamp(70px,14vh,120px);width:auto}
  #menu-tegels{display:flex;gap:clamp(1rem,4vw,2.4rem);justify-content:center;width:min(100%,46rem)}
  .tegel-menu{
    flex:1;max-width:20rem;aspect-ratio:1/1;border:2px solid var(--kaart-diep);border-radius:var(--rond-kaart);
    background:var(--kaart);box-shadow:0 var(--dikte) 0 var(--kaart-diep);cursor:pointer;
    display:grid;place-items:center;padding:1rem;font-family:inherit;
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .tegel-menu:active{transform:translateY(4px);box-shadow:0 1px 0 var(--kaart-diep)}
  .tegel-menu svg{width:78%;height:auto}

  /* Eén terugknop voor alle diepere schermen; hij staat links, de ouderpoort rechts. */
  #terug{
    position:fixed;z-index:9;display:none;
    top:calc(env(safe-area-inset-top, 0px) + 12px);left:calc(env(safe-area-inset-left, 0px) + 8px);
    width:var(--raak-min);height:var(--raak-min);border-radius:var(--rond-knop);cursor:pointer;
    border:2px solid var(--kaart-diep);background:var(--kaart);box-shadow:0 4px 0 var(--kaart-diep);
    place-items:center;padding:0;
  }
  #terug:active{transform:translateY(3px);box-shadow:0 1px 0 var(--kaart-diep)}
  #terug svg{width:48%;height:48%;fill:var(--zacht)}
  body[data-scherm="menu"] #terug,body[data-scherm="schrijfkies"] #terug,
  body[data-scherm="naam"] #terug,body[data-scherm="schrijf"] #terug{display:grid}

  #sk-rij{display:flex;flex-wrap:wrap;gap:clamp(.8rem,3vw,1.6rem);justify-content:center;align-items:center;width:min(100%,50rem)}
  #sk-rij .kaart-letter{--kaartmaat:min(26vw,24vh,190px);width:var(--kaartmaat);height:var(--kaartmaat);font-size:calc(var(--kaartmaat) * .55)}
  #sk-rij .kaart-letter.naamkaart{flex:0 0 min(70vw,34rem);width:min(70vw,34rem);margin-inline:calc((100% - min(70vw,34rem)) / 2);height:min(24vw,16vh,150px);font-size:min(14vw,10vh,5rem);letter-spacing:.12em}

  #sch-rij{display:flex;gap:clamp(.8rem,3vw,2rem);align-items:center;justify-content:center;flex-wrap:wrap}
  #sch-host{aspect-ratio:5/7;height:min(64vh,calc(86vw * 1.4));background:var(--kaart);border:2px solid var(--kaart-diep);
    border-radius:var(--rond-kaart);box-shadow:0 var(--dikte) 0 var(--kaart-diep);padding:.4rem}
  .schrijf-svg{width:100%;height:100%;touch-action:none;display:block}
  .schrijf-svg .vervaag{transition:opacity .9s ease}
  .schrijf-svg .puls{animation:puls 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes puls{50%{transform:scale(1.35)}}
  #sch-zij{display:flex;flex-direction:column;align-items:center;gap:1rem}
  #sch-zij .vriendje{height:clamp(70px,14vh,120px);width:auto}
  #sch-ref{--kaartmaat:min(22vw,14vh,110px);width:var(--kaartmaat);height:var(--kaartmaat);font-size:calc(var(--kaartmaat) * .6);cursor:default}
  #sch-ref[hidden],#sch-zij .knop-verder[hidden]{display:none}   /* display:grid van de klasse wint anders van [hidden] */

  #naam-vriend .vriendje{height:clamp(70px,14vh,120px);width:auto}
  .naam-plekken,.naam-tegels{display:flex;gap:clamp(.6rem,2.4vw,1.4rem);justify-content:center}
  .naam-plek,.naam-tegel{width:min(24vw,20vh,150px);height:min(30vw,25vh,188px);border-radius:var(--rond-kaart)}
  .naam-plek{border:4px dashed var(--kaart-diep);transition:background .2s ease}
  .naam-plek.vol{border-style:solid;border-color:var(--goed);background:rgba(63,125,92,.12)}
  .naam-tegel{
    display:grid;place-items:center;font-weight:700;font-size:min(16vw,13vh,6rem);color:#fff;
    background:var(--vriend);border:2px solid var(--vriend-diep);box-shadow:0 var(--dikte) 0 var(--vriend-diep);
    touch-action:none;cursor:grab;position:relative;z-index:2;
  }
  .naam-tegel.sleep{transition:none;cursor:grabbing;z-index:5}
  .naam-tegel.terug{transition:transform .35s ease}
  .naam-tegel.keuze{outline:5px solid #E9B949;outline-offset:4px}
  .naam-tegel.klaar{background:var(--goed);border-color:var(--goed);box-shadow:none;cursor:default}
  #naam-host{display:flex;flex-direction:column;gap:clamp(1.2rem,5vh,2.6rem);align-items:center}
  @media (prefers-reduced-motion: reduce){
    .schrijf-svg .puls{animation:none}
    .naam-tegel.terug,.naam-tegel.klaar{transition:none}
  }
</style>
</head>
<body>

<button id="ouderpoort" aria-label="Ouderscherm — houd drie seconden ingedrukt"></button>
<button id="terug" aria-label="Terug"><svg viewBox="0 0 24 24"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>

<!-- 1. wie speelt er vandaag mee? Tikken op een figuurtje start meteen het spel:
     evenveel tikken als een startknop, maar zij kiest. -->
<div class="scherm aan" id="s-start">
  <div id="kiezers"></div>
</div>

<!-- 2. welke hoor je? -->
<div class="scherm" id="s-spel">
  <img id="foto" alt="" hidden>
  <div id="plaatje" aria-hidden="true"></div>
  <button id="luister" class="knop-rond" aria-label="Hoor de klank opnieuw">
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.5 7-8.8s-3-7.8-7-8.8z"/></svg>
  </button>
  <div id="keuzes"></div>
  <div id="maatje-plek"></div>
</div>

<!-- 3. klankmuur: vrij spel, niets kan fout -->
<div class="scherm" id="s-muur">
  <div id="muur"></div>
  <button class="knop-verder" id="verder" aria-label="Verder spelen">
    <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
  </button>
</div>

<!-- 4. klaar voor vandaag -->
<div class="scherm" id="s-einde">
  <div id="eind-plek"></div>
</div>

<!-- 1b. startmenu: lezen of schrijven. Geen woorden, want ze kan nog niet lezen. -->
<div class="scherm" id="s-menu">
  <div id="menu-plek"></div>
  <div id="menu-tegels">
    <button class="tegel-menu" id="m-lezen" aria-label="Lezen">
      <svg viewBox="0 0 100 80" aria-hidden="true"><rect x="8" y="12" width="84" height="58" rx="8" fill="#fff" stroke="#E0D2BB" stroke-width="3"/><text x="50" y="55" text-anchor="middle" font-family="Andika" font-weight="700" font-size="40" fill="#2E2A26">m a</text><circle cx="78" cy="22" r="9" fill="#E8956B"/></svg>
    </button>
    <button class="tegel-menu" id="m-schrijven" aria-label="Schrijven">
      <svg viewBox="0 0 100 80" aria-hidden="true"><path d="M14 66 L24 40 L72 12 L84 24 L40 56 Z" fill="#E9B949" stroke="#C9822F" stroke-width="3" stroke-linejoin="round"/><path d="M14 66 L24 40 L40 56 Z" fill="#F6EBD9" stroke="#C9822F" stroke-width="3" stroke-linejoin="round"/><path d="M18 72 C34 62 40 76 56 68 S78 66 90 70" stroke="#E8956B" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
    </button>
  </div>
</div>

<!-- 5. schrijven: haar naam bouwen of een letter schrijven -->
<div class="scherm" id="s-schrijfkies">
  <div id="sk-rij"></div>
</div>

<!-- 6. naam bouwen -->
<div class="scherm" id="s-naam">
  <div id="naam-vriend"></div>
  <div id="naam-host"></div>
</div>

<!-- 7. een letter schrijven -->
<div class="scherm" id="s-schrijf">
  <div id="sch-rij">
    <div id="sch-host"></div>
    <div id="sch-zij">
      <div id="sch-vriend"></div>
      <div class="kaart-letter" id="sch-ref" hidden></div>
      <button class="knop-verder" id="sch-verder" aria-label="Verder" hidden>
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  </div>
</div>

<script type="module">
import { Zeg }   from './js/zeg.js';
import { Log }   from './js/log.js';
import { Motor } from './js/motor.js';
import { laadFiguren, tekenFiguur, figuur, Gekozen, MONDEN } from './js/figuren.js';
import { Familie } from './js/familie.js';
import { schrijfvlak, Voortgang } from './js/schrijf.js';
import { naamBouwer } from './js/naam.js';

/* Stand 1, nu met de meegroei-motor: de motor kiest welke letter aan de beurt is en
   hoeveel keuzes erbij horen. Alles wat een drempel is, staat in data/motor.json. */

let klankVan = {};
let klankAlle = {};                // alle klanken, ook de nog niet geleerde: voor schrijven en naam bouwen
let schrijfData = null, vlak = null, bouwer = null, misCount = 0;                 // id -> wat de computerstem zegt als er geen opname is
let woorden = [];                  // {woord, emoji, begint_met}
let huidige = null, bezig = false;
let sessieStart = 0, vraagTijd = 0, gastModus = null, rondeNr = 0, mijnFiguur = 'maatje';

const $ = id => document.getElementById(id);
const scherm = naam => {
  document.body.dataset.scherm = naam;
  document.querySelectorAll('.scherm').forEach(s => s.classList.toggle('aan', s.id === 's-' + naam));
};

/* Werkt voor élk figuurtje: ze delen dezelfde mond en dezelfde klassen. Dat is precies
   waarom ze uit één lichaam met verkleedstukken bestaan. */
function gezicht(stand, plek = 'maatje-plek') {
  const m = $(plek).querySelector('.vriendje');
  const mond = m && m.querySelector('.mond');
  if (!m || !mond) return;
  m.classList.remove('blij', 'kijkt');
  if (stand === 'blij') { mond.setAttribute('d', MONDEN.blij); m.classList.add('blij'); }
  else if (stand === 'kijkt') { mond.setAttribute('d', MONDEN.kijkt); m.classList.add('kijkt'); }
  else mond.setAttribute('d', MONDEN.rustig);
}

const prijs = () => ['j1','j2','j3','j4','j5','j6','j7'][Math.floor(Math.random()*7)];
const troost = () => ['n1','n2','n3','n4'][Math.floor(Math.random()*4)];

/* Om de zoveel beurten een WOORD in plaats van een losse klank: ze ziet het plaatje,
   hoort papa het woord zeggen, en wijst de beginletter aan. Dat is de brug van losse
   klanken naar lezen — een letter krijgt pas betekenis als ze hem terugvindt in een
   woord dat ze kent.

   Alleen woorden waarvan de beginletter NU in omloop is; anders vraag je iets waarop ze
   het antwoord niet kan weten. */
function woordVraag() {
  const cfg = Motor.config().woordrondes;
  const s = Motor.toestand();
  if (rondeNr % cfg.elke !== 0) return null;

  const stevig = s.actief.filter(id => s.letters[id].sterkte >= Motor.config().letters.stevig_vanaf).length;
  if (stevig < cfg.pas_vanaf_stevig) return null;

  const kan = woorden.filter(w => s.actief.includes(w.begint_met));
  if (!kan.length) return null;

  const w = kan[Math.floor(Math.random() * kan.length)];
  Motor.markeer(w.begint_met);   // anders mist de motor dat deze letter net aan bod kwam
  return {
    doel: w.begint_met,
    opties: Motor.opties(w.begint_met, s.keuzes),
    herhaling: false,
    woord: w
  };
}

/* "Onze namen": ze ziet het gezicht van iemand van wie ze houdt, hoort die persoon zelf
   haar naam zeggen, en kiest het juiste woordbeeld. Dit is geen letterspel — het is de
   fase die daaraan voorafgaat: de vorm van een woord herkennen.

   De foto vervaagt naarmate ze de naam kent. Blijft de foto altijd staan, dan kijkt ze
   naar het gezicht en nooit naar het woord. */
function familieVraag() {
  const cfg = Motor.config().familierondes;
  if (!cfg || rondeNr % cfg.elke !== 0) return null;
  const mensen = Familie.speelbaar();
  if (mensen.length < 2) return null;     // zonder tweede naam valt er niets te kiezen

  const kies = [...mensen].sort(() => Math.random() - .5);
  const doel = kies[0], afleider = kies[1];
  return {
    soort: 'familie',
    doel: doel.id,
    persoon: doel,
    opties: [doel, afleider].sort(() => Math.random() - .5),
    herhaling: false
  };
}

async function toonFamilieVraag() {
  const p = huidige.persoon;
  const url = await Familie.fotoUrl(p.id);
  const sterkte = Familie.fotoSterkte(p);
  const f = $('foto');
  if (url && sterkte > 0) {
    f.src = url; f.style.opacity = sterkte; f.hidden = false;
  } else {
    f.hidden = true;                      // ze kent hem: nu leest ze het woord
  }

  const veld = $('keuzes');
  veld.innerHTML = '';
  veld.dataset.n = 2;
  veld.classList.add('met-plaatje');
  huidige.opties.forEach(q => {
    const b = document.createElement('button');
    b.className = 'kaart-letter kaart-naam';
    b.textContent = q.naam;
    b.setAttribute('aria-label', q.naam);
    b.onclick = () => antwoord(b, q.id);
    veld.appendChild(b);
  });
}

function ronde(vraag = null) {
  bezig = false;
  gezicht('rustig');
  scherm('spel');
  if (!vraag) rondeNr++;
  huidige = vraag || familieVraag() || woordVraag() || Motor.volgende();

  const isFamilie = huidige.soort === 'familie';
  $('foto').hidden = true;
  $('plaatje').textContent = huidige.woord ? huidige.woord.emoji : '';
  $('plaatje').classList.toggle('aan', !!huidige.woord);

  if (isFamilie) {
    toonFamilieVraag();
  } else {
    const veld = $('keuzes');
    veld.innerHTML = '';
    veld.dataset.n = huidige.opties.length;
    veld.classList.toggle('met-plaatje', !!huidige.woord);
    huidige.opties.forEach(id => {
      const b = document.createElement('button');
      b.className = 'kaart-letter';
      b.textContent = id;
      b.setAttribute('aria-label', 'letter ' + id);
      b.onclick = () => antwoord(b, id);
      veld.appendChild(b);
    });
  }

  setTimeout(() => {
    hoorVraag();
    vraagTijd = Date.now();       // vanaf hier meten we hoe snel ze tikt
  }, 400);
}

// Familieronde: de stem van die persoon zelf. Woordronde: het woord. Anders: de klank.
function hoorVraag() {
  if (!huidige) return;
  if (huidige.soort === 'familie') return Zeg.zeg(Familie.stemId(huidige.doel), huidige.persoon.naam);
  return huidige.woord
    ? Zeg.zeg('w_' + huidige.woord.woord, huidige.woord.woord)
    : Zeg.zeg(huidige.doel, klankVan[huidige.doel]);
}

async function antwoord(knop, gekozen) {
  if (bezig) return;
  const reactie = vraagTijd ? Date.now() - vraagTijd : null;

  /* Een familieronde gaat NIET door de lettermotor: het is een andere vaardigheid
     (woordbeeld herkennen), en die zou de letterstatistieken vervuilen. */
  if (huidige.soort === 'familie') return antwoordFamilie(knop, gekozen);

  const r = Motor.antwoord(huidige.doel, gekozen, reactie, huidige.herhaling);

  if (r.juist) {
    bezig = true;
    knop.classList.add('juist');
    gezicht('blij');
    if (!gastModus) Log.boek('juist', { letter: huidige.doel, ms: reactie, telt: r.teltMee, woord: huidige.woord?.woord });
    await Zeg.zeg(prijs(), 'goed zo', { wacht: true });
    /* En dan de klank nog eens. Precies op het moment dat ze trots is, wordt de
       koppeling letter-klank opnieuw gelegd — de goedkoopste leerwinst die er ligt. */
    await Zeg.zeg(huidige.doel, klankVan[huidige.doel], { wacht: true });

    // De sessie eindigt ALTIJD op een juist antwoord, nooit midden in een fout.
    if (r.magAfronden || Date.now() - sessieStart > Motor.sessieMs()) return einde();
    setTimeout(() => ronde(), 300);
    return;
  }

  // Fout: geen rood, geen straf. De klank nog eens, de juiste licht op.
  if (!gastModus) Log.boek('fout', { letter: huidige.doel, gekozen, ms: reactie, telt: r.teltMee, woord: huidige.woord?.woord });
  knop.classList.add('mis');
  gezicht('kijkt');
  await Zeg.zeg(huidige.doel, klankVan[huidige.doel], { wacht: true });
  const juisteKaart = [...document.querySelectorAll('#keuzes .kaart-letter')]
    .find(b => b.textContent === huidige.doel);
  if (juisteKaart) {
    juisteKaart.classList.add('wijs');
    // aantikbaar: ze mag de klank zelf nog eens oproepen in plaats van hem te ondergaan
    juisteKaart.onclick = () => Zeg.zeg(huidige.doel, klankVan[huidige.doel]);
  }

  if (r.gefrustreerd) {
    await Zeg.zeg(troost(), 'goed geprobeerd', { wacht: true });
    return klankmuur();
  }
  // Meteen dezelfde vraag, makkelijker gemaakt: een mislukte poging helpt pas als ze
  // er kort daarna wél in slaagt.
  setTimeout(() => ronde(Motor.herhaal(huidige.doel)), 700);
}

async function antwoordFamilie(knop, gekozen) {
  const juist = gekozen === huidige.doel;
  Familie.telJuist(huidige.doel, juist);
  if (!gastModus) Log.boek(juist ? 'juist' : 'fout', { soort: 'familie', wie: huidige.persoon.naam });

  if (juist) {
    bezig = true;
    knop.classList.add('juist');
    gezicht('blij');
    await Zeg.zeg(prijs(), 'goed zo', { wacht: true });
    await Zeg.zeg(Familie.stemId(huidige.doel), huidige.persoon.naam, { wacht: true });
    if (Date.now() - sessieStart > Motor.sessieMs()) return einde();
    setTimeout(() => ronde(), 300);
    return;
  }

  // fout: geen straf. De stem nog eens, en de juiste naam licht op.
  knop.classList.add('mis');
  gezicht('kijkt');
  await Zeg.zeg(Familie.stemId(huidige.doel), huidige.persoon.naam, { wacht: true });
  const juisteKaart = [...document.querySelectorAll('#keuzes .kaart-letter')]
    .find(b => b.textContent === huidige.persoon.naam);
  if (juisteKaart) {
    juisteKaart.classList.add('wijs');
    juisteKaart.onclick = () => Zeg.zeg(Familie.stemId(huidige.doel), huidige.persoon.naam);
  }
  // en de foto komt terug helpen bij de volgende keer (telJuist heeft hem verlaagd)
  setTimeout(() => ronde(), 1400);
}

/* De klankmuur is de uitweg, niet een straf: hier kan niets fout gaan.
   Ze tikt een letter, ze hoort hem. Verder gaan mag wanneer ze wil. */
function klankmuur() {
  if (!gastModus) Log.boek('muur');
  scherm('muur');
  const m = $('muur');
  m.innerHTML = '';
  Motor.toestand().actief.forEach(id => {
    const b = document.createElement('button');
    b.className = 'kaart-letter';
    b.textContent = id;
    b.setAttribute('aria-label', 'letter ' + id);
    b.onclick = () => Zeg.zeg(id, klankVan[id]);
    m.appendChild(b);
  });
}

async function einde() {
  if (!gastModus) Log.boek('einde');
  $('eind-plek').innerHTML = tekenFiguur(mijnFiguur, { mond: 'blij', klas: 'vriendje blij' });
  $('eind-plek').onclick = naarMenu;      // tikken op het figuurtje brengt haar terug bij het menu
  scherm('einde');
  await Zeg.zeg('s3', 'jij hebt goed gewerkt vandaag', { wacht: true });
  await Zeg.zeg('s2', 'we stoppen hier, tot morgen');
}

/* Het figuurtje bepaalt wie meespeelt; daarna kiest ze lezen of schrijven. */
function kiesFiguur(figuurId) {
  mijnFiguur = figuurId;
  Gekozen.zet(figuurId);
  naarMenu();
}

function naarMenu() {
  stopAlles();
  $('menu-plek').innerHTML = tekenFiguur(mijnFiguur, { mond: 'blij' });
  scherm('menu');
}

async function beginSessie() {
  $('maatje-plek').innerHTML = tekenFiguur(mijnFiguur, { mond: 'rustig' });
  sessieStart = Date.now();
  if (!gastModus) Log.boek('start', { figuur: mijnFiguur });
  await Zeg.zeg('s1', 'dag, zullen we luisteren?', { wacht: true });
  ronde();
}

/* Het kiesscherm. De figuurtjes zijn zelf de knoppen — tikken start het spel, dus het
   kost geen extra stap ten opzichte van een startknop. */
async function bouwKiezers() {
  const lijst = await laadFiguren();
  const vorige = Gekozen.lees() || lijst[0].id;
  const veld = $('kiezers');
  veld.innerHTML = '';
  // wie de vorige keer meespeelde staat vooraan
  const geordend = [...lijst].sort((a, b) => (b.id === vorige) - (a.id === vorige));
  for (const f of geordend) {
    const b = document.createElement('button');
    b.setAttribute('aria-label', 'speel met ' + f.naam);
    b.className = f.id === vorige ? 'gekozen' : '';
    b.innerHTML = tekenFiguur(f.id, { mond: 'blij' });
    b.onclick = () => kiesFiguur(f.id);
    veld.appendChild(b);
  }
}

/* ---- schrijven ---- */

const TERUG = { menu: 'start', schrijfkies: 'menu', naam: 'schrijfkies', schrijf: 'schrijfkies' };

function stopAlles() {
  Zeg.stop();
  if (vlak) { vlak.stop(); vlak = null; }
  if (bouwer) { bouwer.stop(); bouwer = null; }
}

function terugGaan() {
  const naar = TERUG[document.body.dataset.scherm];
  stopAlles();
  if (naar === 'menu') naarMenu();
  else if (naar === 'schrijfkies') naarSchrijfKies();
  else scherm('start');
}

/* Haar naam bovenaan, daaronder de letters die ze kan leren schrijven. Een letter met een
   groene voet is al zelfstandig gelukt. */
function naarSchrijfKies() {
  stopAlles();
  const rij = $('sk-rij');
  rij.innerHTML = '';
  for (const n of schrijfData.namen) {
    const b = document.createElement('button');
    b.className = 'kaart-letter naamkaart';
    b.textContent = n.naam;
    b.setAttribute('aria-label', 'naam bouwen: ' + n.naam);
    b.onclick = () => startNaam(n);
    rij.appendChild(b);
  }
  for (const l of schrijfData.volgorde) {
    const b = document.createElement('button');
    b.className = 'kaart-letter' + (Voortgang.lees(l).beheerst ? ' juist' : '');
    b.textContent = l;
    b.setAttribute('aria-label', 'schrijf de letter ' + l);
    b.onclick = () => startLetter(l);
    rij.appendChild(b);
  }
  scherm('schrijfkies');
}

function startNaam(n) {
  stopAlles();
  $('naam-vriend').innerHTML = tekenFiguur(mijnFiguur, { mond: 'rustig' });
  scherm('naam');                        // eerst tonen: de vakjes meten pas als ze zichtbaar zijn
  bouwer = naamBouwer($('naam-host'), {
    letters: n.letters,
    onPlaats: l => Zeg.zeg(l, klankAlle[l]),
    onNaast: () => gezicht('kijkt', 'naam-vriend'),
    onKlaar: async () => {
      gezicht('blij', 'naam-vriend');
      if (!gastModus) Log.boek('naam', { naam: n.naam });
      await Zeg.zeg(prijs(), 'goed zo', { wacht: true });
      await Zeg.zeg('naam_' + n.naam, n.naam);
    }
  });
}

/* Niveau: de voortgang van dit kind bepaalt het. ?niveau=1..4 in het adres zet het vast,
   zodat ik elk niveau kan uitproberen zonder eerst alles te halen. */
function startLetter(l) {
  stopAlles();
  const v = Voortgang.lees(l);
  const vast = Number(new URLSearchParams(location.search).get('niveau'));
  const niveau = vast >= 1 && vast <= 4 ? vast : v.niveau;
  misCount = 0;
  $('sch-vriend').innerHTML = tekenFiguur(mijnFiguur, { mond: 'rustig' });
  $('sch-ref').textContent = l;
  $('sch-ref').hidden = niveau < 4;      // op niveau 4 staat er niets: zo ziet ze welke letter het is
  $('sch-verder').hidden = true;
  $('sch-verder').onclick = naarSchrijfKies;
  scherm('schrijf');
  vlak = schrijfvlak($('sch-host'), {
    streken: schrijfData.letters[l].streken,
    niveau,
    tolerantie: schrijfData.tolerantie,
    onMis: () => {
      misCount++;
      gezicht('kijkt', 'sch-vriend');
      setTimeout(() => gezicht('rustig', 'sch-vriend'), 900);
      if (misCount === 2) Zeg.zeg(troost(), 'goed geprobeerd');
    },
    onKlaar: async () => {
      gezicht('blij', 'sch-vriend');
      if (!gastModus) {
        Voortgang.klaar(l, misCount);
        Log.boek('schrijf', { letter: l, niveau, missen: misCount });
      }
      await Zeg.zeg(prijs(), 'goed zo', { wacht: true });
      await Zeg.zeg(l, klankAlle[l], { wacht: true });
      $('sch-verder').hidden = false;
    }
  });
  Zeg.zeg(l, klankAlle[l]);              // ze hoort eerst welke klank het is
}

/* ---- opstarten ---- */
(async function () {
  const [klanken, woordData] = await Promise.all([
    fetch('./data/klanken.json').then(r => r.json()),
    fetch('./data/woorden.json').then(r => r.json())
  ]);
  woorden = woordData.woorden;
  klanken.klanken.forEach(k => { klankAlle[k.id] = k.zeg; });
  // De leervolgorde: rekbaar en makkelijk te horen eerst, de verwarrende paren laat.
  const letters = klanken.klanken
    .filter(k => k.start)
    .sort((a, b) => a.start - b.start)
    .map(k => ({ id: k.id, klank: k.zeg }));
  letters.forEach(l => { klankVan[l.id] = l.klank; });

  /* Gastmodus staat in sessionStorage, en dat is precies goed: die verdwijnt vanzelf
     zodra de app dichtgaat. Anders staat hij er over drie weken nog aan en registreert
     de app Ida's voortgang niet meer. */
  gastModus = sessionStorage.getItem('klankspel-gast');
  if (gastModus) document.body.classList.add('gast');

  await Motor.laad(letters, gastModus ? { profiel: 'gast', gastSoort: gastModus } : {});
  await Zeg.laad();

  await bouwKiezers();
  schrijfData = await fetch('./data/schrijven.json').then(r => r.json());
  $('luister').onclick = hoorVraag;
  $('m-lezen').onclick = beginSessie;
  $('m-schrijven').onclick = naarSchrijfKies;
  $('terug').onclick = terugGaan;
  $('verder').onclick = () => ronde();

  // Weggaan halverwege telt ook als informatie: waar haakte ze af?
  addEventListener('pagehide', () => { if (sessieStart && !gastModus) Log.boek('stop'); });
})();

/* ---- ouderpoort: drie seconden ingedrukt ---- */
const poort = $('ouderpoort');
let klok = null;
poort.addEventListener('pointerdown', e => {
  e.preventDefault();
  // teller EERST: setPointerCapture kan gooien en doodde eerder stil de hele poort
  poort.classList.add('gaat');
  klok = setTimeout(() => { location.href = './ouder.html'; }, 3000);
  try { poort.setPointerCapture?.(e.pointerId); } catch {}
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(n =>
  poort.addEventListener(n, () => { clearTimeout(klok); poort.classList.remove('gaat'); }));
poort.addEventListener('dragstart', e => e.preventDefault());
</script>
