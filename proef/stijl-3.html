<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../icon-192.png" type="image/png">
<title>Stijl 3 — Kleurrijk</title>
<style>
  @font-face { font-family:"Andika"; src:url("../fonts/Andika-Regular.woff2") format("woff2"); font-weight:400; }
  @font-face { font-family:"Andika"; src:url("../fonts/Andika-Bold.woff2") format("woff2"); font-weight:700; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    background:#FFF6E6;color:#2E2A26;font-family:"Andika",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(1.5rem,5vh,3rem);padding:1.2rem;user-select:none;overflow:hidden;
  }
  #luister{
    width:clamp(90px,18vw,124px);height:clamp(90px,18vw,124px);border-radius:50%;
    border:none;background:#3E8FB0;display:grid;place-items:center;cursor:pointer;
    box-shadow:0 5px 0 #2E6C87;
  }
  #luister svg{width:46%;height:46%;fill:#FFF;}
  #luister:active{transform:translateY(4px);box-shadow:0 1px 0 #2E6C87;}
  #keuzes{display:flex;gap:clamp(1rem,4vw,2.5rem);flex-wrap:wrap;justify-content:center;}
  .letter{
    width:clamp(130px,29vw,275px);height:clamp(130px,29vw,275px);
    border:none;border-radius:32px;
    font-family:inherit;font-weight:700;font-size:clamp(4.4rem,15vw,9.8rem);color:#FFF9F0;
    display:grid;place-items:center;cursor:pointer;position:relative;
    transition:transform .18s ease, opacity .18s ease;
    text-shadow:0 3px 0 rgba(0,0,0,.13);
  }
  .letter:active{transform:scale(.96);}
  .letter.juist{animation:knal .55s ease;}
  @keyframes knal{40%{transform:scale(1.16) rotate(-3deg)}}
  .letter.mis{opacity:.55;}
  .letter.wijs{animation:zwaai .7s ease 2;}
  @keyframes zwaai{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
  .snipper{position:fixed;width:14px;height:14px;border-radius:3px;pointer-events:none;}
  #terug{position:fixed;top:.7rem;left:.9rem;font-size:1rem;color:#A2957F;text-decoration:none;z-index:5;}
</style>
</head>
<body>

<a id="terug" href="./">‹ terug</a>

<button id="luister" aria-label="Hoor de klank opnieuw">
  <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.5 7-8.8s-3-7.8-7-8.8z"/></svg>
</button>

<div id="keuzes"></div>

<script>
// Bewust GEEN rood en GEEN groen in het letterpalet: een rode tegel naast een groene
// leest voor een kind als "fout naast goed", ook al bedoelen we er niets mee.
const LETTERS = [
  { t:"m", klank:"mmmm", kleur:"#D9743F" }, { t:"s", klank:"ssss", kleur:"#3E8FB0" },
  { t:"r", klank:"rrrr", kleur:"#9B6BB0" }, { t:"v", klank:"vvvv", kleur:"#C2557A" },
  { t:"p", klank:"p",    kleur:"#4A8C8E" }, { t:"t", klank:"t",    kleur:"#B0872F" }
];

let stem = null, doel = null, bezig = false;

function kiesStem() {
  const alle = speechSynthesis.getVoices();
  stem = alle.find(v => v.lang === "nl-BE") || alle.find(v => v.lang.startsWith("nl")) || null;
}
kiesStem();
speechSynthesis.onvoiceschanged = kiesStem;

function zeg(tekst) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(tekst);
  u.lang = "nl-BE"; u.rate = .7;
  if (stem) u.voice = stem;
  speechSynthesis.speak(u);
}

function feest(knop) {
  const r = knop.getBoundingClientRect();
  const kleuren = ["#D9743F", "#3E8FB0", "#9B6BB0", "#C2557A", "#4A8C8E", "#B0872F"];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement("div");
    s.className = "snipper";
    s.style.background = kleuren[i % kleuren.length];
    s.style.left = (r.left + r.width / 2) + "px";
    s.style.top = (r.top + r.height / 2) + "px";
    document.body.appendChild(s);
    const hoek = Math.random() * Math.PI * 2, ver = 90 + Math.random() * 130;
    s.animate([
      { transform:"translate(0,0) rotate(0deg)", opacity:1 },
      { transform:"translate(" + Math.cos(hoek) * ver + "px," + (Math.sin(hoek) * ver + 90) + "px) rotate(" + (Math.random() * 540) + "deg)", opacity:0 }
    ], { duration:900 + Math.random() * 400, easing:"cubic-bezier(.2,.7,.4,1)" })
      .onfinish = () => s.remove();
  }
}

function ronde() {
  bezig = false;
  const pool = [...LETTERS].sort(() => Math.random() - .5).slice(0, 2);
  doel = pool[0];
  const veld = document.getElementById("keuzes");
  veld.innerHTML = "";
  pool.sort(() => Math.random() - .5).forEach(l => {
    const b = document.createElement("button");
    b.className = "letter"; b.textContent = l.t;
    b.style.background = l.kleur;
    b.style.boxShadow = "0 6px 0 rgba(0,0,0,.18)";
    b.onclick = () => antwoord(b, l);
    veld.appendChild(b);
  });
  setTimeout(() => zeg(doel.klank), 350);
}

function antwoord(knop, letter) {
  if (bezig) return;
  if (letter === doel) {
    bezig = true;
    knop.classList.add("juist");
    feest(knop);
    zeg("joepie");
    setTimeout(ronde, 1700);
  } else {
    // Geen rood als straf: de tegel zwakt af, de klank komt opnieuw, de juiste zwaait.
    knop.classList.add("mis");
    zeg(doel.klank);
    setTimeout(() => {
      [...document.querySelectorAll(".letter")].find(b => b.textContent === doel.t).classList.add("wijs");
    }, 900);
  }
}

document.getElementById("luister").onclick = () => zeg(doel.klank);
ronde();
</script>
</body>
</html>
