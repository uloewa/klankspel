<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../icon-192.png" type="image/png">
<title>Stijl 2 — Met een vriendje</title>
<style>
  @font-face { font-family:"Andika"; src:url("../fonts/Andika-Regular.woff2") format("woff2"); font-weight:400; }
  @font-face { font-family:"Andika"; src:url("../fonts/Andika-Bold.woff2") format("woff2"); font-weight:700; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    background:#F6EBD9;color:#2E2A26;font-family:"Andika",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(1rem,3.5vh,2rem);padding:1.2rem;user-select:none;
  }
  #luister{
    width:clamp(84px,17vw,116px);height:clamp(84px,17vw,116px);border-radius:50%;
    border:none;background:#E8956B;display:grid;place-items:center;cursor:pointer;
    box-shadow:0 4px 0 #C9764F;
  }
  #luister svg{width:46%;height:46%;fill:#FFF9F2;}
  #luister:active{transform:translateY(3px);box-shadow:0 1px 0 #C9764F;}
  #keuzes{display:flex;gap:clamp(1rem,4vw,2.5rem);flex-wrap:wrap;justify-content:center;}
  .letter{
    width:clamp(130px,28vw,270px);height:clamp(130px,28vw,270px);
    border:none;border-radius:30px;background:#FFFDF8;box-shadow:0 5px 0 #E0D2BB;
    font-family:inherit;font-weight:700;font-size:clamp(4.4rem,14vw,9.5rem);color:#2E2A26;
    display:grid;place-items:center;cursor:pointer;
    transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  .letter:active{transform:translateY(4px);box-shadow:0 1px 0 #E0D2BB;}
  .letter.juist{box-shadow:0 5px 0 #3F7D5C;transform:translateY(-6px);}
  .letter.mis{opacity:.5;}
  .letter.wijs{box-shadow:0 5px 0 #3F7D5C;animation:wieg .9s ease 2;}
  @keyframes wieg{50%{transform:translateY(-8px)}}

  /* Het vriendje draagt het gevoel — er valt niets te lezen voor een kind van 4. */
  #maatje{width:clamp(110px,22vw,150px);height:auto;transition:transform .25s ease;}
  #maatje.blij{animation:hup .5s ease 2;}
  @keyframes hup{50%{transform:translateY(-22px) scale(1.04)}}
  #maatje.kijkt{transform:rotate(-7deg);}
  .mond{transition:d .2s ease;}
  #terug{position:fixed;top:.7rem;left:.9rem;font-size:1rem;color:#A2957F;text-decoration:none;}
</style>
</head>
<body>

<a id="terug" href="./">‹ terug</a>

<button id="luister" aria-label="Hoor de klank opnieuw">
  <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.5 7-8.8s-3-7.8-7-8.8z"/></svg>
</button>

<div id="keuzes"></div>

<svg id="maatje" viewBox="0 0 120 110" aria-hidden="true">
  <ellipse cx="60" cy="102" rx="34" ry="6" fill="#E0D2BB"/>
  <circle cx="60" cy="58" r="42" fill="#E8956B"/>
  <circle cx="24" cy="34" r="10" fill="#E8956B"/>
  <circle cx="96" cy="34" r="10" fill="#E8956B"/>
  <circle id="oogL" cx="46" cy="52" r="7" fill="#3B2C22"/>
  <circle id="oogR" cx="74" cy="52" r="7" fill="#3B2C22"/>
  <path id="mond" class="mond" d="M48 74 Q60 80 72 74" stroke="#3B2C22" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>

<script>
const LETTERS = [
  { t:"m", klank:"mmmm" }, { t:"s", klank:"ssss" }, { t:"r", klank:"rrrr" },
  { t:"v", klank:"vvvv" }, { t:"p", klank:"p"    }, { t:"t", klank:"t"    }
];

let stem = null, doel = null, bezig = false;
const maatje = document.getElementById("maatje");
const mond = document.getElementById("mond");

function kiesStem() {
  const alle = speechSynthesis.getVoices();
  stem = alle.find(v => v.lang === "nl-BE") || alle.find(v => v.lang.startsWith("nl")) || null;
}
kiesStem();
speechSynthesis.onvoiceschanged = kiesStem;

function zeg(tekst) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(tekst);
  u.lang = "nl-BE"; u.rate = .7;
  if (stem) u.voice = stem;
  speechSynthesis.speak(u);
}

function gezicht(stand) {
  maatje.classList.remove("blij", "kijkt");
  if (stand === "blij") {
    mond.setAttribute("d", "M44 70 Q60 88 76 70");
    maatje.classList.add("blij");
  } else if (stand === "kijkt") {
    // Nieuwsgierig, niet bedrukt: een rond mondje leest als "oh, luister nog eens",
    // nooit als afkeuring. Er valt in deze app niets te verliezen.
    mond.setAttribute("d", "M54 72 a6 6 0 1 0 12 0 a6 6 0 1 0 -12 0");
    maatje.classList.add("kijkt");
  } else {
    mond.setAttribute("d", "M48 74 Q60 80 72 74");
  }
}

function ronde() {
  bezig = false;
  gezicht("rustig");
  const pool = [...LETTERS].sort(() => Math.random() - .5).slice(0, 2);
  doel = pool[0];
  const veld = document.getElementById("keuzes");
  veld.innerHTML = "";
  pool.sort(() => Math.random() - .5).forEach(l => {
    const b = document.createElement("button");
    b.className = "letter"; b.textContent = l.t;
    b.onclick = () => antwoord(b, l);
    veld.appendChild(b);
  });
  setTimeout(() => zeg(doel.klank), 350);
}

function antwoord(knop, letter) {
  if (bezig) return;
  if (letter === doel) {
    bezig = true;
    knop.classList.add("juist");
    gezicht("blij");
    zeg("bravo");
    setTimeout(ronde, 1600);
  } else {
    // Geen rood, geen straf: het vriendje kijkt mee en de klank komt opnieuw.
    knop.classList.add("mis");
    gezicht("kijkt");
    zeg(doel.klank);
    setTimeout(() => {
      [...document.querySelectorAll(".letter")].find(b => b.textContent === doel.t).classList.add("wijs");
    }, 900);
  }
}

document.getElementById("luister").onclick = () => zeg(doel.klank);
ronde();
</script>
</body>
</html>
