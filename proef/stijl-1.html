<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../icon-192.png" type="image/png">
<title>Stijl 1 — Rustig</title>
<style>
  @font-face { font-family:"Andika"; src:url("../fonts/Andika-Regular.woff2") format("woff2"); font-weight:400; }
  @font-face { font-family:"Andika"; src:url("../fonts/Andika-Bold.woff2") format("woff2"); font-weight:700; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    background:#F6EBD9;color:#2E2A26;font-family:"Andika",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(1.5rem,5vh,3rem);padding:1.2rem;user-select:none;
  }
  #luister{
    width:clamp(96px,20vw,132px);height:clamp(96px,20vw,132px);border-radius:50%;
    border:3px solid #D8C7AC;background:#FFFDF8;display:grid;place-items:center;cursor:pointer;
  }
  #luister svg{width:46%;height:46%;fill:#2E2A26;}
  #luister:active{transform:scale(.95);}
  #keuzes{display:flex;gap:clamp(1rem,4vw,2.5rem);flex-wrap:wrap;justify-content:center;}
  .letter{
    width:clamp(130px,30vw,280px);height:clamp(130px,30vw,280px);
    border:3px solid #D8C7AC;border-radius:28px;background:#FFFDF8;
    font-family:inherit;font-weight:700;font-size:clamp(4.4rem,15vw,10rem);color:#2E2A26;
    display:grid;place-items:center;cursor:pointer;position:relative;
    transition:transform .18s ease, border-color .18s ease, opacity .18s ease;
  }
  .letter:active{transform:scale(.97);}
  .letter.juist{border-color:#3F7D5C;transform:scale(1.06);}
  .letter.juist::after{
    content:"";position:absolute;inset:auto auto -14px 50%;transform:translateX(-50%);
    width:34px;height:18px;border-left:6px solid #3F7D5C;border-bottom:6px solid #3F7D5C;
    rotate:-45deg;animation:vink .3s ease both;
  }
  @keyframes vink{from{opacity:0;scale:.5}to{opacity:1;scale:1}}
  .letter.mis{opacity:.45;}
  .letter.wijs{border-color:#3F7D5C;animation:pols 1s ease 2;}
  @keyframes pols{50%{transform:scale(1.05)}}
  #terug{position:fixed;top:.7rem;left:.9rem;font-size:1rem;color:#A2957F;text-decoration:none;}
</style>
</head>
<body>

<a id="terug" href="./">‹ terug</a>

<button id="luister" aria-label="Hoor de klank opnieuw">
  <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.8-5 6.7v2.1c4-1 7-4.5 7-8.8s-3-7.8-7-8.8z"/></svg>
</button>

<div id="keuzes"></div>

<script>
const LETTERS = [
  { t:"m", klank:"mmmm" }, { t:"s", klank:"ssss" }, { t:"r", klank:"rrrr" },
  { t:"v", klank:"vvvv" }, { t:"p", klank:"p"    }, { t:"t", klank:"t"    }
];

let stem = null, doel = null, bezig = false;

function kiesStem() {
  const alle = speechSynthesis.getVoices();
  stem = alle.find(v => v.lang === "nl-BE") || alle.find(v => v.lang.startsWith("nl")) || null;
}
kiesStem();
speechSynthesis.onvoiceschanged = kiesStem;

function zeg(tekst) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(tekst);
  u.lang = "nl-BE"; u.rate = .7;
  if (stem) u.voice = stem;
  speechSynthesis.speak(u);
}

function ronde() {
  bezig = false;
  const pool = [...LETTERS].sort(() => Math.random() - .5).slice(0, 2);
  doel = pool[0];
  const veld = document.getElementById("keuzes");
  veld.innerHTML = "";
  pool.sort(() => Math.random() - .5).forEach(l => {
    const b = document.createElement("button");
    b.className = "letter"; b.textContent = l.t;
    b.onclick = () => antwoord(b, l);
    veld.appendChild(b);
  });
  setTimeout(() => zeg(doel.klank), 350);
}

function antwoord(knop, letter) {
  if (bezig) return;
  if (letter === doel) {
    bezig = true;
    knop.classList.add("juist");
    zeg("juist");
    setTimeout(ronde, 1400);
  } else {
    // Geen rood, geen straf: de klank nog eens, en de juiste licht zachtjes op.
    knop.classList.add("mis");
    zeg(doel.klank);
    setTimeout(() => {
      [...document.querySelectorAll(".letter")].find(b => b.textContent === doel.t).classList.add("wijs");
    }, 900);
  }
}

document.getElementById("luister").onclick = () => zeg(doel.klank);
ronde();
</script>
</body>
</html>
